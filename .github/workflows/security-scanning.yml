name: Security scanning

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 14 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    name: Select security scans
    runs-on: ubuntu-latest
    outputs:
      npm: ${{ steps.changed.outputs.npm }}
      terraform: ${{ steps.changed.outputs.terraform }}
      workflows: ${{ steps.changed.outputs.workflows }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          npm_scan=true
          terraform_scan=true
          workflow_scan=true

          if [[ "$EVENT" == pull_request ]]; then
            npm_scan=false
            terraform_scan=false
            workflow_scan=false
            git diff --name-only -z --no-renames "$BASE_SHA" HEAD > "$RUNNER_TEMP/security-changed-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                package.json|package-lock.json|.nvmrc|.npmrc)
                  npm_scan=true ;;
                infra/*)
                  terraform_scan=true ;;
                .github/workflows/security-scanning.yml|tools/security-scan/*)
                  npm_scan=true
                  terraform_scan=true
                  workflow_scan=true ;;
                .github/workflows/*)
                  workflow_scan=true ;;
              esac
            done < "$RUNNER_TEMP/security-changed-paths"
          fi

          printf 'npm=%s\nterraform=%s\nworkflows=%s\n' "$npm_scan" "$terraform_scan" "$workflow_scan" >> "$GITHUB_OUTPUT"

  npm:
    name: npm dependency audit
    needs: scope
    if: always() && (needs.scope.result == 'failure' || needs.scope.outputs.npm == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify scan scope
        if: needs.scope.result != 'success'
        run: |
          echo 'Scanner error: could not determine npm scan scope.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Set up pinned npm
        run: |
          npm_spec=$(node -p 'require("./package.json").packageManager')
          if [[ ! "$npm_spec" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Scanner error: expected an exact npm version in package.json.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          npm install --global --ignore-scripts --no-audit --no-fund "$npm_spec"
      - name: Audit committed dependencies
        run: |
          full_status=0
          prod_status=0
          npm audit --json --package-lock-only --audit-level=info --include=dev --ignore-scripts > "$RUNNER_TEMP/npm-full.json" 2> "$RUNNER_TEMP/npm-full.stderr" || full_status=$?
          npm audit --json --package-lock-only --audit-level=info --omit=dev --ignore-scripts > "$RUNNER_TEMP/npm-production.json" 2> "$RUNNER_TEMP/npm-production.stderr" || prod_status=$?
          node tools/security-scan/summarize.mjs npm \
            "$RUNNER_TEMP/npm-full.json" "$full_status" \
            "$RUNNER_TEMP/npm-production.json" "$prod_status"

  terraform:
    name: OpenTofu configuration scan
    needs: scope
    if: always() && (needs.scope.result == 'failure' || needs.scope.outputs.terraform == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify scan scope
        if: needs.scope.result != 'success'
        run: |
          echo 'Scanner error: could not determine infrastructure scan scope.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install checksum-pinned Trivy
        env:
          TRIVY_VERSION: '0.76.2'
          TRIVY_SHA256: 'bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf'
        run: |
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl --fail --silent --show-error --location --retry 2 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$TRIVY_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" trivy
      - name: Scan committed OpenTofu source
        run: |
          bash tools/security-scan/terraform.sh "$RUNNER_TEMP/trivy" "$RUNNER_TEMP"

  workflows:
    name: GitHub Actions workflow scan
    needs: scope
    if: always() && (needs.scope.result == 'failure' || needs.scope.outputs.workflows == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify scan scope
        if: needs.scope.result != 'success'
        run: |
          echo 'Scanner error: could not determine workflow scan scope.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install checksum-pinned zizmor
        env:
          ZIZMOR_VERSION: '1.32.0'
          ZIZMOR_SHA256: 'bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b'
        run: |
          archive="$RUNNER_TEMP/zizmor.tar.gz"
          curl --fail --silent --show-error --location --retry 2 \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ZIZMOR_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" zizmor
      - name: Scan workflow source
        run: |
          status=0
          "$RUNNER_TEMP/zizmor" --offline --no-config --strict-collection --no-exit-codes --format=json .github/workflows \
            > "$RUNNER_TEMP/zizmor.json" 2> "$RUNNER_TEMP/zizmor.stderr" || status=$?
          node tools/security-scan/summarize.mjs workflows "$RUNNER_TEMP/zizmor.json" "$status"
