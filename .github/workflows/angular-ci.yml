name: Angular CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Check blog notification metadata
        run: npm run check:blog-notifications
      - name: Build
        run: npm run build
      - name: Serve production build for audit
        run: |
          python3 -m http.server 8080 --directory dist/drakesfood-app/browser &
          sleep 4
      - name: Accessibility audit
        run: npm run audit:accessibility
